name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

env:
  UPSTREAM_REPO: "noseglasses/elf_diff"

jobs:
  test-linux:
    name: Test & Coverage on Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Ubuntu packages
        run: |
          sudo apt update
          sudo apt install -y g++-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .[test]

      - name: Run tests with coverage
        run: |
          export COVERAGE_RCFILE=$PWD/.coveragerc
          mkdir test_output
          cd test_output
          python3 -m coverage run --branch --parallel-mode ../tests/test_main.py -c

      - name: Combine coverage (only on Python 3.10)
        if: matrix.python-version == '3.10'
        run: |
          export COVERAGE_RCFILE=$PWD/.coveragerc
          cd test_output
          python3 -m coverage combine * */*

      - name: Convert coverage to XML (only on Python 3.10)
        if: matrix.python-version == '3.10'
        run: |
          export COVERAGE_RCFILE=$PWD/.coveragerc
          cd test_output
          python3 -m coverage xml

      - name: Upload coverage artifact (only on Python 3.10)
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test_output/coverage.xml

      - name: Upload coverage to Codecov (only on Python 3.10, upstream repo)
        if: matrix.python-version == '3.10' && github.repository == env.UPSTREAM_REPO
        uses: codecov/codecov-action@v2
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          verbose: true

  test-windows:
    name: Test on Windows (Python 3.10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Weasyprint Dependencies
        run: |
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-x86_64-ttf-dejavu mingw-w64-x86_64-pango mingw-w64-x86_64-ghostscript --noconfirm'
          xcopy "C:\msys64\mingw64\share\fonts\TTF" "C:\Users\runneradmin\.fonts" /e /i
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH
          rm C:\msys64\mingw64\bin\python.exe
      - name: Install binutils
        run: |
          which objdump
          which nm
          which size
          C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-x86_64-arm-none-eabi-binutils --noconfirm'
      - name: Install elf_diff Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cffi
          python -m pip install .[test]
      - name: Test
        shell: bash
        run: |
          export PATH="${PATH}:/c/tools/msys64/mingw64/bin:/c/msys64/usr/bin"
          mkdir test_output
          cd test_output
          python ../tests/test_main.py
